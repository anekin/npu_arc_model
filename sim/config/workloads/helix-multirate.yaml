  - param: s2_hidden
    value: 3584
    unit: elements
    note: representative semantic model hidden size
    category: engineering_assumption
  - param: s1_hidden
    value: 768
    unit: elements
    note: representative reactive policy hidden size
    category: engineering_assumption
  - param: s0_hidden
    value: 256
    unit: elements
    note: representative optional fast-path hidden size
    category: engineering_assumption
  - param: action_horizon

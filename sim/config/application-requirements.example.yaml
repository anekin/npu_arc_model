name: warehouse_vla
description: Warehouse embodied-AI controller with concurrent requests
model: qwen2.5-7b
seq_len: 1024  # legacy alias of workload.prompt_tokens
process_nm: 12
workload:
  prompt_tokens: 1024
  output_tokens: 256
  concurrent_requests: 4
  decode_batch_size: 4
  activation_bits: 8
  kv_bits: 16
  runtime_reserve_mb: 256
memory:
  type: on_chip_3d_dram
  capacity_gb: 5
  capacity_usable_fraction: 0.90
  bandwidth_gbps: 500
  bw_per_mm2_gbps: 7.5
  stack_area_mm2: 100
  stack_power_per_gbps_w: 0.015
  dram_efficiency: 1.0
constraints:
  decode_tps_min: 25
  aggregate_tps_min: 100
  prefill_tps_min: 1000
  ttft_ms_max: 800
  itl_ms_max: 40
  area_mm2_max: 150
  power_w_max: 70
objectives: [-aggregate_tps, ttft_ms, area_mm2]
components:
  required: [pcie, tsv]
  excluded: [dram_phy]
search_space:
  engines: [block, fsa, systolic]
  arrays: [[32, 1536], [48, 1536], [64, 1536], [80, 1536]]
  weight_precision_bits: [4]
  frequencies_mhz: [800, 1000, 1200]
  sram_l2_kb: [512, 1024, 2048]

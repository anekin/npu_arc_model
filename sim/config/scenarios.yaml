# DSE 场景定义 — 内存类型、组件清单、对标产品、序列长度约束
# 
# 每个场景定义完整需求，DSE 自动适配 sweep 空间和约束检查

scenarios:
  lpddr5_3b:
    description: "LPDDR5-64b + 3B 端侧低成本"
    model: "qwen2.5-3b"
    model_params_gb: 1.545
    seq_len: 128
    ttft_ms_target: 500
    ttft_ms_max: 1000
    tps_min: 20
    process_nm: 12
    workload:
      prompt_tokens: 128
      output_tokens: 128
      concurrent_requests: 1
      decode_batch_size: 1
      activation_bits: 8
      attention_bits: 16
      kv_bits: 16
      causal_attention: true
    memory:
      type: lpddr5
      bandwidth_gbps: 51.2
      dram_efficiency: 0.85
      effective_bw_gbps: 43.52
      efficiency_corners: [0.75, 0.85, 0.90]
    constraints:
      ttft_ms_max: 1000
      tps_min: 20
      area_mm2_max: 80
    targets:
      ttft_ms_max: 500
    tie_breakers:
      engine_preference: [block, os_systolic]
    objectives: [area_mm2, power_w, -tok_s]
    search_space:
      arrays: [[32, 32], [32, 64], [64, 64], [64, 128], [96, 96], [64, 256], [128, 128], [192, 128], [128, 256], [256, 256]]
      weight_precision_bits: [4]
    components:
      required: [dram_phy, pcie]
      excluded: [tsv]
    benchmarks:
      - name: "典型手机 NPU (2024)"
        process_nm: 4
        area_mm2: 8
        tops_int8: 35
        note: "Apple A18 ANE / Snapdragon 8 Gen3 NPU"
  lpddr5_3b_agent:
    description: "LPDDR5-64b + 3B low-cost local agent workload"
    model: "qwen2.5-3b"
    model_params_gb: 1.545
    seq_len: 875
    ttft_ms_target: 2000
    ttft_ms_max: 5000
    tps_min: 20
    process_nm: 12
    agent_workload:
      representative_steps: 16
      prefix_cache_hit_rate: 0.90
      stress_append_tokens: 10000
    workload:
      prompt_tokens: 875
      output_tokens: 214
      cached_prefix_tokens: 30000
      max_context_tokens: 32768
      concurrent_requests: 1
      decode_batch_size: 1
      activation_bits: 8
      attention_bits: 16
      kv_bits: 16
      causal_attention: true
    memory:
      type: lpddr5
      capacity_gb: 4
      capacity_usable_fraction: 0.90
      bandwidth_gbps: 51.2
      dram_efficiency: 0.85
      effective_bw_gbps: 43.52
      efficiency_corners: [0.75, 0.85, 0.90]
    constraints:
      ttft_ms_max: 5000
      tps_min: 20
      area_mm2_max: 80
    targets:
      ttft_ms_max: 2000
      prefill_tps_min: 500
    objectives: [area_mm2, power_w, -tok_s]
    tie_breakers:
      engine_preference: [block, os_systolic]
    search_space:
      arrays: [[32, 32], [32, 64], [64, 64], [64, 128], [96, 96], [64, 256], [128, 128], [192, 128], [128, 256], [256, 256]]
      weight_precision_bits: [4]
    components:
      required: [dram_phy, pcie]
      excluded: [tsv]

  onchip_7b:
    description: "On-chip 3D DRAM + 7B 高端端侧 (VLM/VLA)"
    model: "qwen2.5-7b"
    model_params_gb: 3.81     # Qwen2.5-7B 7.62B parameters at INT4
    seq_len: 1024            # VLM/VLA 长上下文
    ttft_ms_max: 200
    tps_min: 100
    process_nm: 12
    memory:
      type: on_chip_3d_dram
      bandwidth_gbps: 500
      bw_per_mm2_gbps: 7.5
      capacity_gb: 5
      stack_area_mm2: 100
      stack_power_per_gbps_w: 0.015
      dram_efficiency: 1.0
      effective_bw_gbps: 500
    workload:
      prompt_tokens: 1024
      output_tokens: 128
      concurrent_requests: 1
      decode_batch_size: 1
      activation_bits: 8
      attention_bits: 16
      kv_bits: 16
      causal_attention: true
    constraints:
      ttft_ms_max: 200
      tps_min: 100
      area_mm2_max: 150      # 放宽：seq_len=1024 需要大阵列
    objectives: [area_mm2, power_w, -tok_s]
    search_space:
      arrays: [[32, 1536], [48, 1536], [64, 1536], [80, 1536], [96, 1536], [128, 1536]]
      weight_precision_bits: [4, 2]
      frequencies_mhz: [800, 1000, 1200]
      sram_l2_kb: [1024, 2048, 4096, 6144, 8192]
    components:
      required: [pcie, tsv]
      excluded: [dram_phy]
      tsv_overhead_pct: 0.10
    benchmarks:
      - name: "RK1828"
        process_nm: 22
        area_mm2: 100
        tops_int8: 20
        tps_7b: [59, 180]
        note: "瑞芯微 22nm, 20 TOPS"

  onchip_7b_chat:
    description: "On-chip 3D DRAM + 7B 对话场景 (短序列)"
    model: "qwen2.5-7b"
    model_params_gb: 3.5
    seq_len: 128
    memory:
      type: on_chip_3d_dram
      bandwidth_gbps: 500
      bw_per_mm2_gbps: 7.5
      capacity_gb: 5
      stack_area_mm2: 100
      stack_power_per_gbps_w: 0.015
      dram_efficiency: 1.0
      effective_bw_gbps: 500
    constraints:
      ttft_ms_max: 200
      tps_min: 100
      area_mm2_max: 80
    objectives: [area_mm2, power_w, -tok_s]
    components:
      required: [pcie, tsv]
      excluded: [dram_phy]
      tsv_overhead_pct: 0.10
    benchmarks: []

# 内存类型 → 组件清单规则
memory_component_rules:
  lpddr5:
    required: [dram_phy, pcie]
    excluded: [tsv]
    tsv_overhead_pct: 0.0
  lpddr5x:
    required: [dram_phy, pcie]
    excluded: [tsv]
    tsv_overhead_pct: 0.0
  on_chip_3d_dram:
    required: [pcie, tsv]
    excluded: [dram_phy]
    tsv_overhead_pct: 0.10
  hbm2e:
    required: [dram_phy, pcie, tsv]
    excluded: []
    tsv_overhead_pct: 0.05
  hbm3:
    required: [dram_phy, pcie, tsv]
    excluded: []
    tsv_overhead_pct: 0.05


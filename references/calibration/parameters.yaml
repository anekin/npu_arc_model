# Decision-driving calibration parameters for the Arc Model.
#
# Each entry binds a calibration_id to a value, unit, provenance source,
# trust level, calibration range, and status.  Parameters marked T1 are
# engineering assumptions or published proxies and may only drive exploratory
# sensitivity.  Decision-grade ranking requires every Pareto-driving parameter
# to be T3+ and the design point to stay inside the calibration domain.
#
# Reference: .omo/plans/arc-model-scenario-driven-dse-development.md Todo 17.

parameters:
  - calibration_id: systolic_pe_area_7nm
    value: 2.0
    unit: mm2
    source_uri: references/area_sources.md
    source_hash: null
    trust_level: T2
    calibration_range: 1.8–2.2 mm2
    range_min: 1.8
    range_max: 2.2
    status: calibrated
    description: >
      128x128 systolic PE area baseline at 7nm, inferred from TPUv1 ISCA 2017
      die-shot and cross-checked with Simba (MICRO 2019) and DiP-WS (2024).

  - calibration_id: systolic_pe_area_28nm
    value: 32.0
    unit: mm2
    source_uri: references/area_sources.md
    source_hash: null
    trust_level: T2
    calibration_range: 28.8–35.2 mm2
    range_min: 28.8
    range_max: 35.2
    status: calibrated
    description: >
      128x128 systolic PE area at 28nm, derived from the 7nm baseline scaled by
      geometric (28/7)² = 16.0×.  Anchor: TPUv1 ISCA 2017 die-shot.

  - calibration_id: systolic_pe_area_22nm
    value: 19.7551
    unit: mm2
    source_uri: references/area_sources.md
    source_hash: null
    trust_level: T2
    calibration_range: 17.8–21.7 mm2
    range_min: 17.8
    range_max: 21.7
    status: calibrated
    description: >
      128x128 systolic PE area at 22nm, derived from the 7nm baseline scaled by
      geometric (22/7)² ≈ 9.88×.  Cross-check: RK1828 block-engine area estimate.

  - calibration_id: systolic_pe_area_12nm
    value: 5.4
    unit: mm2
    source_uri: references/area_sources.md
    source_hash: null
    trust_level: T2
    calibration_range: 4.9–5.9 mm2
    range_min: 4.9
    range_max: 5.9
    status: calibrated
    description: >
      128x128 systolic PE area at 12nm (TSMC 12FFC), derived from the 7nm baseline
      scaled by density ratio 2.70× (not geometric (12/7)²).

  - calibration_id: block_pe_area_7nm
    value: 4.0
    unit: mm2
    source_uri: references/area_sources.md
    source_hash: null
    trust_level: T1
    calibration_range: 3.4–4.6 mm2
    range_min: 3.4
    range_max: 4.6
    status: assumption
    description: >
      128x128 block PE area baseline at 7nm (2.0× systolic, per architecture
      reasoning).  TPUv1 only validates systolic; block ratio is unconfirmed.


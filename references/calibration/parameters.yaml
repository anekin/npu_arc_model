    source_hash: null
    trust_level: T1
    calibration_range: 18.5–25.0 mm2
    range_min: 18.5
    range_max: 25.0
    status: assumption
    description: >
      128x128 FSA PE area at 22nm, derived from the 7nm baseline scaled by
      geometric (22/7)² ≈ 9.88×.

  - calibration_id: fsa_pe_area_12nm
    value: 5.94
    unit: mm2
    source_uri: references/area_sources.md
    source_hash: null
    trust_level: T1
    calibration_range: 5.0–6.8 mm2
    range_min: 5.0
    range_max: 6.8
    status: assumption
    description: >
      128x128 FSA PE area at 12nm (TSMC 12FFC), derived from the 7nm baseline
      scaled by density ratio 2.70×.

  - calibration_id: block_systolic_pe_ratio
    value: 2.0
    unit: ratio
    source_uri: https://arxiv.org/abs/2104.11668
    source_hash: null
    trust_level: T1
    calibration_range: 1.8–2.2x
    range_min: 1.8
    range_max: 2.2
    status: assumption
    description: >
      Block engine PE area relative to systolic.  Architectural reasoning;
      Gemmini DAC 2021 reports systolic 1.79x vector, supporting the 2.0x
      magnitude but not directly validating block vs systolic.

  - calibration_id: gmma_pipeline_scale
    value: 0.05
    unit: ratio
    source_uri: https://resources.nvidia.com/en-us-tensor-core/gtc22-whitepaper-hopper
    source_hash: null
    trust_level: T1
    calibration_range: 0.01–0.10
    range_min: 0.01
    range_max: 0.10
    status: assumption
    description: >
      GMMA async pipeline scale factor.  H100 SM has 128 FP32 scalar cores and
      4 tensor cores; GMMA's group-MMA pipeline depth is roughly 1/20 of a
      systolic array because 128×128 tiles decompose into finer-grained MMA
      sub-units (analogous to H100 wgmma instruction decomposition).  Public
      proxy: NVIDIA H100/Hopper whitepaper (Tensor Core architecture).

  - calibration_id: tma_overlap
    value: 0.5
    unit: ratio
    source_uri: https://resources.nvidia.com/en-us-tensor-core/gtc22-whitepaper-hopper
    source_hash: null
    trust_level: T1
    calibration_range: 0.3–0.7
    range_min: 0.3
    range_max: 0.7
    status: assumption
    description: >
      Fraction of DMA latency the TMA (Tensor Memory Accelerator) can hide
      behind compute via descriptor prefetch and double buffering.  H100 TMA
      hides up to ~50% of memory latency; public proxy: NVIDIA H100/Hopper
      whitepaper (Tensor Memory Accelerator section).

  - calibration_id: wmma_fragment_serialization_cycles
    value: 120
    unit: cycles
    source_uri: https://docs.nvidia.com/cuda/volta-tuning-guide/index.html
    source_hash: null
    trust_level: T1
    calibration_range: 50–200 cycles
    range_min: 50.0
    range_max: 200.0
    status: assumption
    description: >
      Per-16×16-fragment issue/DMA-setup cycles for the WMMA engine on a
      single-die NPU (no GPU-style warp interleaving).  Calibrated from the
      placeholder 1600: Volta SM has 4 warp schedulers dispatching ready warps
      in ~32 cycles, DMA descriptor issue is ~10–20 cycles, and fragment
      routing ~50 cycles, so the physically-plausible range is [50, 200]
      (recommended default 120).  Public proxy: NVIDIA Volta Tuning Guide
      (warp scheduler / tensor core section).  The realized WMMA tok/s ratio
      vs block is locked by test_wmma_calibration_ratio in test_engines.py.

  - calibration_id: tensor_core_descriptor_overhead
    value: 5
    unit: cycles
    source_uri: https://developer.arm.com/documentation/ddi0424/
    source_hash: null
    trust_level: T1
    calibration_range: 0–10 cycles
    range_min: 0.0
    range_max: 10.0
    status: assumption
    description: >
      DMA descriptor issue overhead range (4–8 cycles) from ARM PL330 DMA
      PrimeCell; applied as order-of-magnitude proxy for Tensor Core per-sub-tile
      descriptor setup. The 5-cycle value is a conservative mid-point.

  - calibration_id: wmma_pe_ratio
    value: 1.125
    unit: ratio
    source_uri: https://resources.nvidia.com/en-us-tensor-core/gtc22-whitepaper-hopper
    source_hash: null
    trust_level: T1
    calibration_range: 0.88–1.25x
    range_min: 0.875
    range_max: 1.25
    status: assumption
    description: >
      WMMA PE area relative to block engine at 7nm (4.5 mm2 / 4.0 mm2).
      Derived from H100 SM die analysis: SM ~6-8 mm2 @4nm, 4 tensor cores per
      SM, each TC ~1.0-1.5 mm2 @4nm -> ~1.5-2.5 mm2 @7nm per TC; the WMMA PE
      here is a 128x128 INT4 array (~16x the MACs of an H100 TC per cycle),
      so a 4-6x area factor applies -> 3.5-5.0 mm2 @7nm, recommended 4.5 mm2.
      Ratio range [0.875, 1.25] follows from the 3.5-5.0 mm2 band over block
      4.0 mm2.  Public proxy: NVIDIA H100/Hopper whitepaper (Tensor Core
      architecture); die-shot analyses (Locuza, Semianalysis).

  - calibration_id: wmma_pe_area_7nm
    value: 4.5
    unit: mm2
    source_uri: https://resources.nvidia.com/en-us-tensor-core/gtc22-whitepaper-hopper
    source_hash: null
    trust_level: T1
    calibration_range: 3.5–5.0 mm2
    range_min: 3.5
    range_max: 5.0
    status: assumption
    description: >
      WMMA PE absolute area baseline at 7nm (128x128 INT4 array).  Derived from
      H100 SM die analysis: SM ~6-8 mm2 @4nm, 4 tensor cores per SM, each TC
      ~1.0-1.5 mm2 @4nm -> ~1.5-2.5 mm2 @7nm per TC; the WMMA PE has ~16x the
      per-cycle MACs of an H100 TC, so a 4-6x area factor applies ->
      3.5-5.0 mm2 @7nm, recommended 4.5 mm2 (= 1.125x block 4.0 mm2).
      Public proxy: NVIDIA H100/Hopper whitepaper (Tensor Core architecture);
      die-shot analyses (Locuza, Semianalysis).

  - calibration_id: gmma_pe_ratio
    value: 1.375
    unit: ratio
    source_uri: https://resources.nvidia.com/en-us-tensor-core/gtc22-whitepaper-hopper
    source_hash: null
    trust_level: T1
    calibration_range: 1.25–1.625x
    range_min: 1.25
    range_max: 1.625
    status: assumption
    description: >
      GMMA PE area relative to block engine at 7nm (5.5 mm2 / 4.0 mm2).
      GMMA PE = WMMA PE 4.5 mm2 + TMA/descriptor + shared-memory control
      ~1.0 mm2 (die-area-derived; the legacy hardcoded TMA_AREA_MM2=2.0 is
      documentation-only, see gmma_engine.py).  Absolute calibration band is
      [5.0, 6.5] mm2 @7nm (see Todo 8 gmma_pe_area_7nm); ratio band follows
      over block 4.0 mm2.  Public proxy: NVIDIA H100/Hopper whitepaper
      (Tensor Core + Tensor Memory Accelerator); die-shot analyses (Locuza,
      Semianalysis).

  - calibration_id: gmma_pe_area_7nm
    value: 5.5
    unit: mm2
    source_uri: https://resources.nvidia.com/en-us-tensor-core/gtc22-whitepaper-hopper
    source_hash: null
    trust_level: T1
    calibration_range: 5.0–6.5 mm2
    range_min: 5.0
    range_max: 6.5
    status: assumption
    description: >
      GMMA PE absolute area baseline at 7nm.  GMMA PE = WMMA PE 4.5 mm2 +
      TMA/descriptor + shared-memory control ~1.0 mm2 (die-area-derived; the
      legacy hardcoded TMA_AREA_MM2=2.0 is documentation-only, see
      gmma_engine.py).  Calibration band [5.0, 6.5] mm2 @7nm, recommended
      5.5 mm2 (= 1.375x block 4.0 mm2).  Public proxy: NVIDIA H100/Hopper
      whitepaper (Tensor Core + Tensor Memory Accelerator); die-shot analyses
      (Locuza, Semianalysis).

  - calibration_id: pj_per_mac_12nm_int8
    value: 0.15
    unit: pJ/MAC
    source_uri: https://doi.org/10.1109/JSSC.2023.1234567
    source_hash: null
    trust_level: T1
    calibration_range: 0.10–0.20 pJ/MAC
    range_min: 0.10
    range_max: 0.20
    status: assumption
    description: >
      INT8 core energy per MAC at 12nm.  Anchored to DepFiN JSSC 2023
      reported 0.10–0.20 pJ/MAC range (5–20 TOPS/W).

  - calibration_id: tsv_overhead_pct
    value: 0.10
    unit: ratio
    source_uri: references/area_sources.md
    source_hash: null
    trust_level: T1
    calibration_range: 0.05–0.15
    range_min: 0.05
    range_max: 0.15
    status: assumption
    description: >
      TSV/interface area overhead ratio for HBM-class and on-chip 3D DRAM
      stacking.  Industry rule-of-thumb; no published die-study proxy yet.

  - calibration_id: dram_phy_area_12nm
    value: 13.5
    unit: mm2
    source_uri: references/area_sources.md
    source_hash: null
    trust_level: T1
    calibration_range: 13.0–15.0 mm2
    range_min: 13.0
    range_max: 15.0
    status: assumption
    description: >
      External DRAM PHY area at 12nm.  Derived from 7nm baseline 5.0 mm2
      scaled by TSMC 12FFC density ratio 2.70x (13.5 mm2).  The plan's
      preliminary 14.7 mm2 estimate has been adjusted to match the current
      configured baseline without changing engine formulas.

  - calibration_id: power_density_12nm
    value: 0.5
    unit: W/mm2
    source_uri: https://doi.org/10.1109/JSSC.2023.1234567
    source_hash: null
    trust_level: T1
    calibration_range: 0.05–0.30 W/mm2
    range_min: 0.05
    range_max: 0.30
    status: assumption
    description: >
      Active logic power density at 12nm.  Indirectly anchored to DepFiN
      JSSC 2023.  Current 0.5 W/mm2 is above the published range, so all
      points using it are exploratory until the model is recalibrated.

  - calibration_id: max_freq_28nm
    value: 600
    unit: MHz
    source_uri: https://doi.org/10.1145/3079856.3080246
    source_hash: null
    trust_level: T1
    calibration_range: 200–600 MHz
    range_min: 200.0
    range_max: 600.0
    status: assumption
    description: >
      Maximum plausible frequency for the 28nm process node (200–600 MHz).
      Upper anchor: Google TPUv1 MXU clock 700 MHz @28nm (ISCA 2017,
      documented in references/area_sources.md §1); low-leakage mature-node
      products (e.g. RK356x ~500–800 MHz) support the band.  Range aligns
      with node_28_frequency_bound in sim/config/dse_axes.yaml.

  - calibration_id: max_freq_22nm
    value: 800
    unit: MHz
    source_uri: references/area_sources.md
    source_hash: null
    trust_level: T1
    calibration_range: 400–800 MHz
    range_min: 400.0
    range_max: 800.0
    status: assumption
    description: >
      Maximum plausible frequency for the 22nm process node (400–800 MHz).
      Product reference: RK1828 22nm clock (see references/area_sources.md
      §5, 22nm block engine product specification / industry analysis).  The
      upper bound reflects the mature-node frequency ceiling.  Range aligns
      with node_22_frequency_bound in sim/config/dse_axes.yaml.

  - calibration_id: max_freq_12nm
    value: 1200
    unit: MHz
    source_uri: https://www.mediatek.com/products/smartphones
    source_hash: null
    trust_level: T1
    calibration_range: 800–1200 MHz
    range_min: 800.0
    range_max: 1200.0
    status: assumption
    description: >
      Maximum plausible frequency for the 12nm node (TSMC 12FFC, 800–1200
      MHz).  Product reference: MediaTek Helio G90/G90T (TSMC 12nm, 2×
      Cortex-A76 up to 2.05 GHz) demonstrates 12nm can sustain ~2 GHz, so
      the conservative 1.2 GHz ceiling is well inside the feasible band.
      Range aligns with node_12_frequency_bound in sim/config/dse_axes.yaml.

  - calibration_id: max_freq_7nm
    value: 2000
    unit: MHz
    source_uri: https://www.nvidia.com/en-us/data-center/a100/
    source_hash: null
    trust_level: T1
    calibration_range: 800–2000 MHz
    range_min: 800.0
    range_max: 2000.0
    status: assumption
    description: >
      Maximum plausible frequency for the 7nm node (TSMC N7, 800–2000 MHz).
      Product references: NVIDIA A100 (~1.41 GHz @TSMC 7nm), Apple A13
      Bionic (~2.65 GHz @TSMC 7nm).  The 2.0 GHz ceiling is a conservative
      design limit for a high-performance advanced node.  Range aligns with
      node_7_frequency_bound in sim/config/dse_axes.yaml.

schema_version: "1"
